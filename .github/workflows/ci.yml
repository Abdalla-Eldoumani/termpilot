name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - run: npm ci

      # node-pty 1.1.0 ships a darwin-arm64 prebuilt that fails posix_spawnp at
      # runtime on macos-latest. Rebuild from source against the local toolchain.
      - name: Rebuild node-pty on macOS
        if: runner.os == 'macOS'
        run: npm rebuild node-pty --build-from-source

      - run: npm run check

      - run: npm run lint

      - run: npm run test:run
